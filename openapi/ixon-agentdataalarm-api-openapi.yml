                  minLength: 1
                  type: string
                formula:
                  maxLength: 255
                  minLength: 2
                  type: string
                audience:
                  type: object
                  properties:
                    publicId:
                      type: string
                autoAcknowledge:
                  type: boolean
                booleanNormalValue:
                  type: boolean
                offDelay:
                  maximum: 4294967295
                  type: integer
                  format: int32
                offResetDelay:
                  maximum: 4294967295
                  type: integer
                  format: int32
                onDelay:
                  maximum: 4294967295
                  type: integer
                  format: int32
                onResetDelay:
                  maximum: 4294967295
                  type: integer
                  format: int32
                operatorInstructionRtn:
                  maxLength: 65535
                  minLength: 0
                  type:
                  - string
                  - 'null'
                outOfService:
                  type: boolean
                severity:
                  enum:
                  - low
                  - medium
                  - high
