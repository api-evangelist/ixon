paths:
  /agents/{agentId}/data-alarms/{publicId}:
    get:
      tags:
      - AgentDataAlarm
      summary: AgentDataAlarm
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - type
                - data
                properties:
                  status:
                    type: string
                    default: success
                  type:
                    type: string
                  data:
                    type: object
                    properties:
                      publicId:
                        maxLength: 12
                        minLength: 12
                        type: string
                      agent:
                        type: object
                        properties:
                          publicId:
                            type: string
                      device:
                        type:
                        - object
                        - 'null'
                        properties:
                          publicId:
                            type: string
                      source:
                        type:
                        - object
                        - 'null'
                        properties:
                          publicId:
                            type: string
                      audience:
                        type: object
                        properties:
                          publicId:
                            type: string
                      type:
                        enum:
                        - unary
                        - boolean
                        - error_bits
                        - threshold
                        - rate_of_change
                        - bit_pattern
                        type: string
                      name:
                        maxLength: 255
                        minLength: 1
                        type: string
                      autoAcknowledge:
                        type: boolean
                      booleanNormalValue:
                        type: boolean
                      formula:
                        maxLength: 255
                        minLength: 2
                        type: string
                      offDelay:
                        maximum: 4294967295
                        type: integer
                        format: int32
                      offResetDelay:
                        maximum: 4294967295
                        type: integer
                        format: int32
                      onDelay:
                        maximum: 4294967295
                        type: integer
                        format: int32
                      onResetDelay:
                        maximum: 4294967295
                        type: integer
                        format: int32
                      operatorInstructionRtn:
                        maxLength: 65535
                        minLength: 0
                        type:
                        - string
                        - 'null'
                      outOfService:
                        type: boolean
                      severity:
                        enum:
                        - low
                        - medium
                        - high
                        type: string
        4XX:
          $ref: '#/components/responses/4XXErrorResponse'
      parameters:
      - $ref: '#/components/parameters/apiVersion'
      - $ref: '#/components/parameters/apiApplication'
      - $ref: '#/components/parameters/apiCompany'
      - $ref: '#/components/parameters/apiBrandingOptional'
      - $ref: '#/components/parameters/fieldsParameter'
      - $ref: '#/components/parameters/filtersParameter'
      - required: true
        name: agentId
        in: path
        schema:
          type: string
      - required: true
        name: publicId
        in: path
        schema:
          type: string
      security:
      - bearerToken: []
      operationId: getAgentsByAgentIdDataAlarmsByPublicId
      x-operation-id-source: derived
