openapi: 3.2.0
info:
  contact:
    name: IXON B.V.
    url: https://www.ixon.cloud/
    email: support@ixon.cloud
  description: API for the IXON Cloud Platform
  license:
    name: All Rights Reserved
    url: https://www.ixon.cloud/
  title: IXON Agent Router Wan Config API
  version: 0.1.294
servers:
- description: IXON Cloud platform server
  url: https://portal.ixon.cloud:443/api/
tags:
- name: AgentRouterWanConfig
paths:
  /agents/{agentId}/router-wan-config:
    patch:
      tags:
      - AgentRouterWanConfig
      summary: AgentRouterWanConfig
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - type
                - data
                properties:
                  status:
                    type: string
                    default: success
                  type:
                    type: string
                  data:
                    type:
                    - object
                    - 'null'
        4XX:
          $ref: '#/components/responses/4XXErrorResponse'
      parameters:
      - $ref: '#/components/parameters/apiVersion'
      - $ref: '#/components/parameters/apiApplication'
      - $ref: '#/components/parameters/apiCompany'
      - $ref: '#/components/parameters/apiBrandingOptional'
      - required: true
        name: agentId
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agent:
                  type: object
                  properties:
                    publicId:
                      type: string
                multiwanPolicy:
                  enum:
                  - eth_cell_wifi
                  - cell_eth_wifi
                  - eth_wifi_cell
                  - wifi_eth_cell
                  - cell_wifi_eth
                  - wifi_cell_eth
                  type:
                  - string
                  - 'null'
                ipUseDhcp:
                  type:
                  - boolean
                  - 'null'
                ipAddress:
                  maxLength: 255
                  minLength: 0
                  type:
                  - string
                  - 'null'
                ipGateway:
                  maxLength: 255
                  minLength: 0
                  type:
                  - string
                  - 'null'
                ipNetMask:
                  maxLength: 255
                  minLength: 0
                  type:
                  - string
                  - 'null'
                dnsServers:
                  type: array
                  items:
                    maxLength: 255
                    minLength: 0
                    type: string
                dnsRebindProtectionEnabled:
                  type:
                  - boolean
                  - 'null'
                cellularApn:
                  maxLength: 255
                  minLength: 0
                  type:
                  - string
                  - 'null'
                cellularPincode:
                  maxLength: 8
                  minLength: 0
                  type:
                  - string
                  - 'null'
                cellularMtu:
                  maximum: 1500
                  minimum: 576
                  type:
                  - integer
                  - 'null'
                  format: int32
                digitalInputMode:
                  enum:
                  - disable_vpn_high
                  - disable_vpn_low
                  - disable_wan_high
                  - disable_wan_low
                  type:
                  - string
                  - 'null'
                wanTrackInterval:
                  maximum: 4294967295
                  type:
                  - integer
                  - 'null'
                  format: int32
                wanTrackIps:
                  type: array
                  items:
                    maxLength: 255
                    minLength: 0
                    type: string
                wlanTrackInterval:
                  maximum: 4294967295
                  type:
                  - integer
                  - 'null'
                  format: int32
                wlanTrackIps:
                  type: array
                  items:
                    maxLength: 255
                    minLength: 0
                    type: string
                cellularTrackInterval:
                  maximum: 4294967295
                  type:
                  - integer
                  - 'null'
                  format: int32
                cellularTrackIps:
                  type: array
                  items:
                    maxLength: 255
                    minLength: 0
                    type: string
                httpProxyAddress:
                  maxLength: 255
                  minLength: 0
                  type:
                  - string
                  - 'null'
                httpProxyPort:
                  maximum: 4294967295
                  type:
                  - integer
                  - 'null'
                  format: int32
                httpProxyAuthentication:
                  enum:
                  - none
                  - basic
                  - ntlm
                  type:
                  - string
                  - 'null'
                httpProxyUsername:
                  maxLength: 255
                  minLength: 0
                  type:
                  - string
                  - 'null'
                httpProxyIsSocks5:
                  type:
                  - boolean
                  - 'null'
      security:
      - bearerToken: []
      operationId: patchAgentsByAgentIdRouterWanConfig
      x-operation-id-source: derived
components:
  parameters:
    apiVersion:
      required: true
      description: Version of the API to use
      name: Api-Version
      in: header
      schema:
        type: integer
        format: int32
        enum:
        - 2
    apiBrandingOptional:
      required: false
      description: Domain that provides the branding
      name: Api-Branding
      in: header
      schema:
        type: string
        pattern: .+(\..[^.]+)
    apiApplication:
      required: true
      description: Get your Application ID via support@ixon.cloud
      name: Api-Application
      in: header
      schema:
        type: string
        pattern: ^[0-9a-zA-Z]{12}$
    apiCompany:
      required: true
      description: PublicId of the company
      name: Api-Company
      in: header
      schema:
        type: string
        pattern: ^(\d{4}-){4}\d{4}$
  schemas:
    4XXErrorSchema:
      type: object
      properties:
        message:
          type: string
        propertyName:
          type:
          - string
          - 'null'
        listIndex:
          type:
          - integer
          - 'null'
          format: int32
      required:
      - message
  responses:
    4XXErrorResponse:
      description: 4XX error response
      content:
        application/json:
          schema:
            type: object
            required:
            - status
            - type
            - data
            properties:
              status:
                type: string
                default: error
              type:
                type: string
                default: Error
              data:
                type: array
                items:
                  $ref: '#/components/schemas/4XXErrorSchema'
  securitySchemes:
    bearerToken:
      type: http
      description: Bearer token created by the endpoint "POST AccessTokenList"
      scheme: bearer
x-samples-languages:
- curl
- ruby
- javascript
- python
- powershell
