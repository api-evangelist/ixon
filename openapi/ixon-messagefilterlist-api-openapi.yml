                          minLength: 1
                          nullable: true
                          type: string
                        notShortContains:
                          maxLength: 255
                          minLength: 1
                          nullable: true
                          type: string
                        contains:
                          maxLength: 255
                          minLength: 1
                          nullable: true
                          type: string
                        notContains:
                          maxLength: 255
                          minLength: 1
                          nullable: true
                          type: string
                        publicId:
                          maxLength: 12
                          minLength: 12
                          nullable: false
                          type: string
        4XX:
          $ref: '#/components/responses/4XXErrorResponse'
      parameters:
      - $ref: '#/components/parameters/apiVersion'
      - $ref: '#/components/parameters/apiApplication'
      - $ref: '#/components/parameters/apiBrandingOptional'
      - $ref: '#/components/parameters/fieldsParameter'
