                        notSystemLabels:
                          nullable: false
                          type: boolean
                        longContains:
                          maxLength: 255
                          minLength: 1
                          nullable: true
                          type: string
                        notLongContains:
                          maxLength: 255
                          minLength: 1
                          nullable: true
                          type: string
                        shortContains:
