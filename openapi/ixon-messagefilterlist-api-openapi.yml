      tags:
      - MessageFilterList
      summary: MessageFilterList
      responses:
        '200':
          description: Success response. Data could be an object instead of a list when one value is returned
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - type
                - data
                properties:
                  status:
                    type: string
                    default: success
                    nullable: false
                  type:
                    type: string
                    nullable: false
                  moreAfter:
                    type: string
                    nullable: true
                  data:
                    nullable: false
                    type: array
                    items:
                      type: object
                      properties:
                        actions:
                          type: array
                          items:
                            enum:
                            - delete
                            - mark-as-read
                            - dont-send-webhook-trigger
                            - forward-to-mail
                            - dont-forward-to-mail
                            - dont-send-push-notification
                            nullable: false
                            type: string
                        companyPublicIds:
                          type: array
