                            maxLength: 24
                            minLength: 24
                            nullable: false
                            pattern: (\d{4}-){4}\d{4}
                            type: string
                        notCompanyPublicIds:
                          nullable: false
                          type: boolean
                        systemLabels:
                          type: array
                          items:
                            enum:
                            - router-pulled
                            - alarm-low
                            - alarm-medium
                            - alarm-high
                            nullable: false
